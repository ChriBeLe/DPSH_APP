<!DOCTYPE html>

    <meta charset="UTF-8">
    <!-- ZOOM DI SISTEMA CONSENTITO (era user-scalable=no, maximum-scale=1.0).
         Motivo: è un'app da campo, sotto il sole e con gli occhiali sporchi; impedire di
         ingrandire è la barriera di accessibilità più banale che esista (WCAG 1.4.4 chiede
         almeno il 200%: qui il tetto è 500%).
         Perché si può fare senza rompere i gesti dell'app: il pinch del browser parte solo
         dove l'elemento toccato dichiara touch-action con "pinch-zoom" incluso. Nell'app:
           · body ha touch-action:manipulation → pinch di sistema SÌ, doppio tocco per
             ingrandire NO (che è proprio quello che vogliamo: sulla schermata del contatore
             due tocchi rapidi sono due colpi, non una richiesta di zoom);
           · il canvas dell'editor ha touch-action:pan-x pan-y → il pinch di sistema NON parte
             lì, quindi il pinch a due dita continua a essere lo zoom dell'editor, come prima;
           · maniglie, tela da disegno e slider hanno touch-action:none → invariati.
         Cioè: si guadagna lo zoom dove serve leggere, senza toglierlo dove era già nostro. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, interactive-widget=resizes-content">
    <title>DPSH Field Collector - Penetrometria Dinamica</title>
