
    <!-- CONFRONTO TRA PROVE (voce 12): le prove di un progetto sullo stesso asse delle profondità, in una
         sola figura: a sinistra i valori sovrapposti (colpi N o Rpd), a destra le colonne stratigrafiche.
         Così una profondità si legge in orizzontale su tutto. Lo riempie renderConfrontoProve. -->
    <div class="modal-overlay" id="modalConfrontoProveOverlay"></div>
    <div class="modal confronto" id="modalConfrontoProve" role="dialog" aria-modal="true" aria-labelledby="modalConfrontoProveTitolo">
        <div class="modal-title c-riga-tra-mb" id="modalConfrontoProveTitolo">
            <span class="c-riga4">
                <span class="c-riga-q30-sfondo">
                    <svg class="ico c-accento"><use href="#i-chart"/></svg>
                </span>
                <span id="lblConfrontoTitolo" class="c-ellissi">Confronta prove</span>
            </span>
            <!-- Le stesse prove nello spazio: colonne alle posizioni GPS vere (vedi 071h). -->
            <button type="button" class="bt confr-x" id="btnConfronto3d" title="Le prove nello spazio, alle loro posizioni GPS"><svg class="ico"><use href="#i-map"/></svg>Vista 3D</button>
            <button class="btn-icon c-muto-sfondo-bordo2" id="btnCloseConfrontoX" title="Chiudi" aria-label="Chiudi"><svg class="ico"><use href="#i-x"/></svg></button>
        </div>
        <div class="c-did-muto-mb2">
            Profondità dal piano campagna, uguali per tutte le prove. Tocca una prova per mostrarla o nasconderla; le interpretazioni alternative partono nascoste.
        </div>
        <div class="confr-riga-mb-avvolge">
            <div id="confrontoGrandezza" class="c-riga-avvolge"></div>
            <div class="confronto-scarica" aria-label="Scarica la figura">
                <span>Scarica</span>
                <button type="button" data-formato="svg"><svg class="ico"><use href="#i-download"/></svg>SVG</button>
                <button type="button" data-formato="png"><svg class="ico"><use href="#i-download"/></svg>PNG</button>
                <button type="button" data-formato="pdf"><svg class="ico"><use href="#i-download"/></svg>PDF</button>
            </div>
        </div>
        <div id="confrontoProve" class="c-riga-mb-avvolge"></div>
        <div id="confrontoGrafico"></div>
        <div id="confrontoLegendaStrati" class="confr-riga-did-muto"></div>
    </div>
