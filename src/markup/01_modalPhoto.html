
    <!-- MODAL ANTEPRIMA FOTO GEOREFERENZIATA -->
    <div class="modal-overlay" id="modalPhotoOverlay"></div>
    <div class="modal" id="modalPhotoPreview" style="max-width: 92vw; padding: 14px; text-align: center;">
        <div class="modal-title" id="lblPhotoTitle"><svg class="ico"><use href="#i-camera"/></svg> Foto Georeferenziata</div>
        <img id="imgFullPreview" src="" style="max-width: 100%; max-height: 60vh; border-radius: var(--radius-md); object-fit: contain; margin-bottom: 10px; border: 1px solid var(--border);">
        <div id="lblPhotoGpsMeta" style="font-size: 11px; color: var(--accent); font-weight: 600; margin-bottom: 10px; background: var(--bg-card-hover); padding: 8px; border-radius: var(--radius-sm);"></div>
        <button class="btn-action" id="btnImportPhotoGps" style="width: 100%; margin-bottom: 10px; background: var(--accent); color: var(--on-accent); border: none; font-weight: 700; display: none;">
            <svg class="ico"><use href="#i-pin"/></svg> Importa Coordinate GPS da Questa Foto nella Prova
        </button>
        <button class="btn-action" id="btnRitagliaFoto" style="width: 100%; margin-bottom: 10px; background: var(--bg-card-hover); color: var(--text-main); border: 1px solid var(--border); font-weight: 700;">
            <svg class="ico"><use href="#i-crop"/></svg> Ritaglia questa foto
        </button>
        <button class="btn-action" id="btnDownloadSinglePhotoJpg" style="width: 100%; margin-bottom: 10px; background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.4); font-weight: 700;">
            <svg class="ico"><use href="#i-download"/></svg> Scarica Foto JPEG Originale (.jpg)
        </button>

        <div class="modal-actions" style="justify-content: flex-end;">
            <button class="btn-action" id="btnClosePhotoPreview" style="background: var(--bg-card-hover); color: var(--text-main); border: 1px solid var(--border);"><svg class="ico"><use href="#i-back"/></svg> Torna alle Foto</button>
        </div>
    </div>
