
    <!-- MODAL ANTEPRIMA FOTO GEOREFERENZIATA -->
    <div class="modal-overlay" id="modalPhotoOverlay"></div>
    <div class="modal foto-pad" id="modalPhotoPreview" role="dialog" aria-modal="true" aria-labelledby="lblPhotoTitle">
        <div class="modal-title" id="lblPhotoTitle"><svg class="ico"><use href="#i-camera"/></svg> Foto Georeferenziata</div>
        <img id="imgFullPreview" alt="Anteprima della foto" src="" class="foto-bordo-mb">

        <button class="btn-action foto-sfondo-bordo-mb" id="btnRitagliaFoto">
            <svg class="ico"><use href="#i-crop"/></svg> Ritaglia questa foto

        <div class="modal-actions foto-x">
            <button class="btn-action c-sfondo-bordo" id="btnClosePhotoPreview"><svg class="ico"><use href="#i-back"/></svg> Torna alle Foto</button>
