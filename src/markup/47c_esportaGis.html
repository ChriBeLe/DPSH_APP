    <!-- ESPORTA PER GIS: il formato (GeoPackage per QGIS, KMZ/KML per Google Earth) e i livelli da mettere,
         con gli stili della mappa. La riempie il 071t. -->
    <div id="esportaGis" class="gis-esporta" hidden>
        <div class="gis-finestra" role="dialog" aria-modal="true" aria-labelledby="gisTitolo">
            <div class="gis-testa"><b id="gisTitolo">Esporta</b>
                <button type="button" class="chiudi-x" id="gisChiudi" title="Chiudi (Esc)" aria-label="Chiudi"><svg class="ico"><use href="#i-x"/></svg></button></div>
            <div class="gis-campo"><span>Che cosa</span>
                <div class="gis-formati" id="gisFormato" role="radiogroup">
                    <div class="gis-formati-gruppo">Per la relazione</div>
                    <button type="button" data-formato="tavole" aria-pressed="false"><svg class="ico"><use href="#i-print"/></svg><b>Tavole 2D e 3D</b><span>PDF unico o immagini: modello, sezioni 3D e 2D</span></button>
                    <div class="gis-formati-gruppo">Per i GIS (con gli stili della mappa)</div>
                    <button type="button" data-formato="gpkg" aria-pressed="true"><svg class="ico"><use href="#i-layers"/></svg><b>GeoPackage</b><span>QGIS: i layer con i loro stili e il modello 3D</span></button>
                    <button type="button" data-formato="kmz" aria-pressed="false"><svg class="ico"><use href="#i-map"/></svg><b>KMZ</b><span>Google Earth, con le icone della mappa</span></button>
                    <button type="button" data-formato="kml" aria-pressed="false"><svg class="ico"><use href="#i-map"/></svg><b>KML</b><span>Google Earth, icone standard</span></button>
                    <div class="gis-formati-gruppo">La vista 3D</div>
                    <button type="button" data-formato="svg" aria-pressed="false"><svg class="ico"><use href="#i-download"/></svg><b>Immagine SVG</b><span>La vista 3D com'è adesso, con la legenda</span></button>
                    <button type="button" data-formato="obj" aria-pressed="false"><svg class="ico"><use href="#i-download"/></svg><b>Modello OBJ</b><span>In metri veri, per Blender, MeshLab</span></button>
                </div>
                <span class="t-didascalia" id="gisNotaFormato"></span></div>
            <div class="gis-campo" id="gisLivelliBox"><span>Livelli da includere <span class="gis-tutti"><button type="button" class="bt-link" id="gisTutti">Tutti</button> · <button type="button" class="bt-link" id="gisNessuno">Nessuno</button></span></span>
                <div id="gisLivelli" class="gis-livelli"></div></div>
            <p class="t-didascalia" id="gisNotaStili">Gli stili sono quelli della mappa: simbolo, riempimento, contorno, grandezza ed etichette di ogni livello (si cambiano col tasto destro sul livello → «Stile…»).</p>
            <div class="tavole-azioni">
                <button type="button" class="bt" id="gisAnnulla">Annulla</button>
                <button type="button" class="bt bt-principale" id="gisEsporta"><svg class="ico"><use href="#i-download"/></svg><span>Esporta</span></button>
            </div>
        </div>
    </div>
