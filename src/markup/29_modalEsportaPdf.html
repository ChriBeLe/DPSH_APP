
    <!-- MODAL ESPORTAZIONE PDF (richiesta esplicitamente, in sostituzione della vecchia finestra
         di stampa "nuda" senza opzioni): scelta di quali prove includere (solo in ambito progetto),
         indice cliccabile, qualità JPEG per contenere il peso del file, stima pagine/peso prima di
         generare, poi una barra di avanzamento durante la generazione vera e propria — vedi
         apriEsportazionePdfModal/avviaGenerazioneEsportazionePdf. -->
    <div class="modal-overlay" id="modalEsportaPdfOverlay"></div>
    <div class="modal" id="modalEsportaPdf" style="max-width:460px;">
        <!-- .modal-header non è mai esistita come classe in questo file (solo .modal-title, vedi
             tutte le altre modali) e #i-close non esiste nello sprite icone (solo #i-x): senza
             flex/gap la riga titolo+chiudi collassava e l'icona non si vedeva, lasciando solo un
             quadrato scuro vuoto sotto il titolo — bug segnalato esplicitamente ("cos'è quel
             tasto? se lo premo si chiude la finestra"). Sistemato riusando lo stesso identico
             markup/stile di .modal-title già usato da ogni altra modale dell'app. -->
        <div class="modal-title" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
            <span style="display: flex; align-items: center; gap: 9px; min-width: 0;">
                <span style="width: 30px; height: 30px; border-radius: 10px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                    <svg class="ico" style="color: var(--accent-ink);"><use href="#i-print"/></svg>
                </span>
                <span id="lblEsportaPdfTitolo" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Esporta PDF</span>
            </span>
            <button class="btn-icon" id="btnCloseEsportaPdfModal" title="Chiudi" style="background: transparent; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 2px 6px; flex-shrink: 0;"><svg class="ico"><use href="#i-x"/></svg></button>
        </div>
        <!-- IN ORDINE (come la barra dell'editor del template): tre sezioni, dal «cosa» al «come» —
             Contenuto (capitolo introduttivo, prove col loro template, tavole), Impaginazione (indice,
             numeri di pagina), Immagini (qualità delle foto) — e in fondo la stima e Genera. Gli id
             sono quelli di prima: il 045 non cambia. -->
        <div id="esportaPdfBodyOpzioni" class="esp-corpo">
            <section id="esportaPdfListaProveWrap" class="esp-sez" style="display:none;">
                <div class="esp-titolo"><span>Contenuto del documento</span>
                    <span class="esp-titolo-azioni">
                        <button type="button" id="btnEsportaPdfSelezionaTutte" class="esp-link">Tutte</button>
                        <button type="button" id="btnEsportaPdfDeselezionaTutte" class="esp-link esp-link-tenue">Nessuna</button>
                    </span></div>
                <div id="esportaPdfListaProve" class="esp-lista"></div>
                <!-- Lo stesso template a TUTTE le prove in un clic; il menu di ogni riga resta per l'eccezione. -->
                <div class="esp-riga-template">
                    <span class="esp-etichetta">Template per tutte</span>
                    <select id="selEsportaPdfTemplateBulk" class="form-control esp-select"></select>
                    <button type="button" id="btnEsportaPdfApplicaTemplateTutte" class="esp-chip">Applica a tutte</button>
                    <button type="button" class="esp-icona" id="btnEsportaPdfGestisciTemplate" title="Gestisci template" aria-label="Gestisci template"><svg class="ico"><use href="#i-settings"/></svg></button>
                </div>
            </section>

            <section class="esp-sez">
                <div class="esp-titolo"><span>Impaginazione</span></div>
                <label id="esportaPdfIndiceRow" class="esp-spunta" style="display:none;">
                    <input type="checkbox" id="chkEsportaPdfIndice">
                    <span>Indice all'inizio <small>— cliccabile nel PDF</small></span>
                </label>
                <!-- I template indice (state.indiceTemplates), popolati in JS: si mostra con l'indice. -->
                <div id="esportaPdfIndiceStileRow" class="esp-sotto" style="display:none;">
                    <span class="esp-etichetta">Stile</span>
                    <select id="selEsportaPdfIndiceStile" class="form-control esp-select"></select>
                    <button type="button" id="btnEsportaPdfIndicePersonalizza" class="esp-chip">Personalizza…</button>
                </div>
                <!-- LA NUMERAZIONE E' UNA SCELTA DEL DOCUMENTO, NON DEL TEMPLATE: vale per tutte le pagine o
                     per nessuna, e il totale e' quello vero perche' si conta a documento finito. -->
                <label id="esportaPdfNumeriRow" class="esp-spunta">
                    <input type="checkbox" id="chkEsportaPdfNumeriPagina">
                    <span>Numera le pagine <small>— «Pagina X di Y» in fondo a ogni foglio</small></span>
                </label>
            </section>

            <section class="esp-sez">
                <div class="esp-titolo"><span>Qualità delle foto (JPEG)</span><b id="lblEsportaPdfQualitaValore">80%</b></div>
                <input type="range" id="rangeEsportaPdfQualita" min="30" max="100" step="5" value="80" class="esp-cursore">
                <div class="esp-estremi"><span>File più leggero</span><span>Qualità originale</span></div>
            </section>

            <div class="esp-stima">
                <div><b id="lblEsportaPdfPagineStima">–</b><span>Pagine (stima)</span></div>
                <div><b id="lblEsportaPdfPesoStima">–</b><span>Peso stimato</span></div>
            </div>

            <button type="button" id="btnEsportaPdfGenera" class="btn-action esp-genera">
                <svg class="ico"><use href="#i-print"/></svg> Genera PDF
            </button>
        </div>

        <div id="esportaPdfBodyProgresso" style="display:none; padding:20px 4px; text-align:center;">
            <div style="width:34px; height:34px; margin:0 auto 16px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--accent); animation:esportaPdfSpin 0.8s linear infinite;"></div>
            <style>@keyframes esportaPdfSpin { to { transform: rotate(360deg); } }</style>
            <div id="lblEsportaPdfProgressoStato" style="font-weight:700; font-size:13px; color:var(--text-main); margin-bottom:6px;">Preparazione...</div>
            <div style="background:var(--bg-main); border:1px solid var(--border); border-radius:8px; height:8px; overflow:hidden;">
                <div id="barraEsportaPdfProgresso" style="background:var(--accent); height:100%; width:0%; transition:width var(--mov-medio) var(--ease-entra);"></div>
            </div>
            <div id="lblEsportaPdfProgressoDettaglio" style="font-size:10.5px; color:var(--text-muted); margin-top:8px;"></div>
        </div>
    </div>
