
    <!-- CRONOLOGIA DELLE COPIE AUTOMATICHE (voce 11). Dal menu mostra tutte le copie, dal pannello di
         un progetto solo quelle che lo contengono. «Ripristina» rimette un progetto com'era, e solo
         quello. Lo riempie renderCronologia. -->
    <div class="modal-overlay" id="modalCronologiaOverlay"></div>
    <div class="modal" id="modalCronologia" style="max-width: 460px; max-height: 88vh; overflow-y: auto;">
        <div class="modal-title" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
            <span style="display: flex; align-items: center; gap: 9px; min-width: 0;">
                <span style="width: 30px; height: 30px; border-radius: 10px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                    <svg class="ico" style="color: var(--accent-ink);"><use href="#i-reset"/></svg>
                </span>
                <span id="lblCronologiaTitolo" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Copie automatiche</span>
            </span>
            <button class="btn-icon" id="btnCloseCronologiaX" title="Chiudi" style="background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 2px 6px; flex-shrink: 0;"><svg class="ico"><use href="#i-x"/></svg></button>
        </div>
        <div id="lblCronologiaSottotitolo" style="font-size: 12px; color: var(--text-muted); line-height: 1.5; margin-bottom: 12px;"></div>
        <div id="elencoCronologia" style="display: flex; flex-direction: column; gap: 8px;"></div>
    </div>
