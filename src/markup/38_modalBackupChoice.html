
    <!-- MODAL SCELTA FORMATO BACKUP (JSON vs ZIP) — usata sia per il backup di un singolo
         progetto sia per il backup completo dell'archivio (vedi impostazioni). -->
    <div class="modal-overlay" id="modalBackupChoiceOverlay"></div>
    <div class="modal c-x9" id="modalBackupChoice" role="dialog" aria-modal="true" aria-labelledby="modalBackupChoiceTitolo">
        <div class="modal-title c-riga-tra-mb" id="modalBackupChoiceTitolo">
            <span class="c-riga4">
                <span class="backup-riga-q30-sfondo">
                    <svg class="ico backup-x"><use href="#i-download"/></svg>
                </span>
                <span id="lblBackupChoiceTitle" class="c-ellissi">Scegli il formato del backup</span>
            </span>
            <button class="btn-icon c-sez-muto-sfondo2" id="btnCloseBackupChoiceX" title="Chiudi" aria-label="Chiudi"><svg class="ico"><use href="#i-x"/></svg></button>
        </div>
        <div class="c-did-muto-mb4">In entrambi i formati vengono salvate <strong>tutte</strong> le foto, senza perdita di qualità: cambia solo il modo in cui vengono incluse nel file.</div>
        <!-- Controllo dei dati (Fase 1): come nella finestra Esporta. Vedi renderIntegritaPrimaExport. -->
        <div id="integritaPrimaBackup" class="c-mb" style="display:none"></div>

        <div class="c-colonna2">
            <button type="button" class="btn-action backup-sfondo-bordo-pad" id="btnBackupChoiceJson">
                <svg class="ico backup-mt"><use href="#i-file"/></svg>
                <span class="c-min">
                    <span class="backup-testo-mb">JSON — un file unico</span>
                    <span class="backup-did-muto">Le foto restano incorporate nel testo del file, insieme a tutti gli altri dati. Comodo perché è un solo file da conservare o inviare, ma su progetti con molte foto diventa pesante e può essere lento (o, su alcuni telefoni, non riuscire a completarsi).</span>
                </span>
            </button>
            <button type="button" class="btn-action backup-sfondo-bordo-pad" id="btnBackupChoiceZip">
                <svg class="ico backup-mt"><use href="#i-download"/></svg>
                <span class="c-min">
                    <span class="backup-testo-mb">ZIP — foto come file originali</span>
                    <span class="backup-did-muto">Le foto vengono salvate come file immagine separati, identici agli originali (stessa qualità, stessi dati EXIF), invece di essere incorporate nel testo. Più leggero e più affidabile con molte foto; puoi anche aprire le singole foto direttamente dallo ZIP.</span>
                </span>
            </button>
        </div>
    </div>
