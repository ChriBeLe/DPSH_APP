
    <!-- MODAL GESTIONE ARCHIVIO LITOLOGICO GLOBALE (elenco, statistiche, export/import) -->
    <div class="modal-overlay tier-strati-top" id="modalArchiveManagerOverlay"></div>
    <div class="modal tier-strati-top arcman-x" id="modalArchiveManager" role="dialog" aria-modal="true" aria-labelledby="modalArchiveManagerTitolo">
        <div class="modal-title c-tra" id="modalArchiveManagerTitolo">
            <span><svg class="ico"><use href="#i-database"/></svg> Archivio litologico</span>
            <button class="btn-icon c-muto-sfondo-bordo" id="btnCloseArchiveManagerX" aria-label="Chiudi"><svg class="ico"><use href="#i-x"/></svg></button>
        </div>
        <div class="arcman-did-muto-sfondo">
            <svg class="ico"><use href="#i-info"/></svg> Voci comuni a tutti i progetti del software. Le statistiche sono calcolate in tempo reale su tutto l'archivio prove.
        </div>
        <div class="arcman-riga-mb">
            <button class="btn-action arcman-did-sfondo-bordo" id="btnExportArchive"><svg class="ico"><use href="#i-download"/></svg> Esporta JSON</button>
            <button class="btn-action arcman-did-sfondo-bordo2" id="btnImportArchiveBtn"><svg class="ico"><use href="#i-upload"/></svg> Importa JSON</button>
            <input type="file" id="fileImportArchive" accept="application/json,.json" style="display:none;">
        </div>
        <div class="arcman-mb-pos">
            <input type="text" id="txtArchiveSearch" class="form-control arcman-x2" placeholder="Cerca strato per nome...">
            <svg class="ico arcman-muto-pos"><use href="#i-search"/></svg>
        </div>
        <div id="archiveManagerList" class="c-colonna2"></div>
        <div class="modal-actions arcman-mt">
            <button class="btn-action c-accento-sfondo-bordo" id="btnCloseArchiveManager"><svg class="ico"><use href="#i-x"/></svg> Chiudi</button>
        </div>
    </div>
