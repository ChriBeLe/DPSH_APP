
    <!-- MODAL GESTIONE TEMPLATE DI REPORT: libreria di layout salvabili per il Report PDF della
         singola prova. "Classico" è precompilato e non eliminabile/rinominabile. Per ora "Duplica"
         crea una copia con nome proprio ma contenuto identico (stesso layout storico) — la
         possibilità di ridisporre/ridimensionare i blocchi arriva con l'editor a griglia. -->
    <div class="modal-overlay" id="modalReportTemplatesOverlay"></div>
    <div class="modal c-x10" id="modalReportTemplates" role="dialog" aria-modal="true" aria-labelledby="modalReportTemplatesTitolo">
        <div class="modal-title c-riga-tra-mb2" id="modalReportTemplatesTitolo">
            <span class="c-riga4">
                <span class="c-riga-q30-sfondo">
                    <svg class="ico c-accento"><use href="#i-stack"/></svg>
                </span>
                <span>Template di Report</span>
            </span>
            <button type="button" class="chiudi-x" id="btnCloseReportTemplatesX" title="Chiudi" aria-label="Chiudi"><svg class="ico"><use href="#i-x"/></svg></button>
        </div>
        <div class="c-did-muto-mb3">
            Ogni prova può usare un template diverso. «Classico» è il layout di partenza: si può modificare, ma non rinominare né eliminare.
        </div>

        <div id="reportTemplatesList" class="libtpl-colonna-mb"></div>

        <div class="libtpl-did-muto-mb">Template dell'indice</div>
        <div id="indiceTemplatesList" class="libtpl-colonna-mb2"></div>

        <!-- Due righe deliberate, non un flex-wrap lasciato libero di spezzare dove capita
             (con 4 bottoni + Chiudi in una sola riga "elastica" il testo più lungo li faceva
             cadere su 3 righe scomposte, segnalato esplicitamente come "disastro di tasti"):
             riga 1 = le due azioni di creazione, stesso peso; riga 2 = le azioni accessorie
             (backup) a sinistra, Chiudi isolato a destra come da posizione storica. -->
        <div class="c-riga-mb">
            <button type="button" class="btn-action libtpl-riga" id="btnNewEmptyReportTemplate" title="Crea un template da zero, senza pagine o blocchi precompilati"><svg class="ico c-q14"><use href="#i-plus"/></svg> Nuovo vuoto</button>
            <button type="button" class="btn-action libtpl-riga" id="btnNewIndiceTemplate" title="Crea un nuovo template per lo stile dell'indice"><svg class="ico c-q14"><use href="#i-plus"/></svg> Nuovo template Indice</button>
        </div>
        <div class="modal-actions libtpl-riga-tra">
            <span class="c-riga">
                <button type="button" class="btn-icon" id="btnExportReportTemplates" title="Esporta i template personalizzati in un file di backup" aria-label="Esporta i template personalizzati in un file di backup"><svg class="ico"><use href="#i-download"/></svg></button>
                <button type="button" class="btn-icon" id="btnImportReportTemplates" title="Importa template da un file di backup" aria-label="Importa template da un file di backup"><svg class="ico"><use href="#i-upload"/></svg></button>
                <input type="file" id="inputImportReportTemplates" accept="application/json,.json" style="display:none;">
            </span>
            <!-- (Fase 3) Niente «Chiudi»: c'è già la X in alto. -->
        </div>
    </div>
    <!-- Un solo menù per tutte le righe di entrambi gli elenchi: position:fixed perché dentro
         un elenco che scorre (overflow-y:auto) verrebbe tagliato al primo pixel fuori. -->
    <div id="menuAzioniTemplate" class="tpl-riga-menu"></div>
