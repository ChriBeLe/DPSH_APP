
    <!-- MODAL GESTIONE TEMPLATE DI REPORT: libreria di layout salvabili per il Report PDF della
         singola prova. "Classico" è precompilato e non eliminabile/rinominabile. Per ora "Duplica"
         crea una copia con nome proprio ma contenuto identico (stesso layout storico) — la
         possibilità di ridisporre/ridimensionare i blocchi arriva con l'editor a griglia. -->
    <div class="modal-overlay" id="modalReportTemplatesOverlay"></div>
    <div class="modal" id="modalReportTemplates" style="max-width: 460px;">
        <div class="modal-title" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
            <span style="display: flex; align-items: center; gap: 9px; min-width: 0;">
                <span style="width: 30px; height: 30px; border-radius: 10px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                    <svg class="ico" style="color: var(--accent-ink);"><use href="#i-stack"/></svg>
                </span>
                <span>Template di Report</span>
            </span>
            <button type="button" class="chiudi-x" id="btnCloseReportTemplatesX" title="Chiudi" aria-label="Chiudi"><svg class="ico"><use href="#i-x"/></svg></button>
        </div>
        <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 14px; line-height: 1.4;">
            Ogni prova può usare un template diverso. «Classico» è il layout di partenza: si può modificare, ma non rinominare né eliminare.
        </div>

        <div id="reportTemplatesList" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; max-height: 320px; overflow-y: auto;"></div>

        <div style="font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px;">Template dell'indice</div>
        <div id="indiceTemplatesList" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; max-height: 220px; overflow-y: auto;"></div>

        <!-- Due righe deliberate, non un flex-wrap lasciato libero di spezzare dove capita
             (con 4 bottoni + Chiudi in una sola riga "elastica" il testo più lungo li faceva
             cadere su 3 righe scomposte, segnalato esplicitamente come "disastro di tasti"):
             riga 1 = le due azioni di creazione, stesso peso; riga 2 = le azioni accessorie
             (backup) a sinistra, Chiudi isolato a destra come da posizione storica. -->
        <div style="display: flex; gap: 8px; margin-bottom: 8px;">
            <button type="button" class="btn-action" id="btnNewEmptyReportTemplate" title="Crea un template da zero, senza pagine o blocchi precompilati" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;"><svg class="ico" style="width: 14px; height: 14px;"><use href="#i-plus"/></svg> Nuovo vuoto</button>
            <button type="button" class="btn-action" id="btnNewIndiceTemplate" title="Crea un nuovo template per lo stile dell'indice" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;"><svg class="ico" style="width: 14px; height: 14px;"><use href="#i-plus"/></svg> Nuovo template Indice</button>
        </div>
        <div class="modal-actions" style="display: flex; justify-content: space-between; align-items: center; gap: 8px;">
            <span style="display: flex; gap: 8px;">
                <button type="button" class="btn-icon" id="btnExportReportTemplates" title="Esporta i template personalizzati in un file di backup"><svg class="ico"><use href="#i-download"/></svg></button>
                <button type="button" class="btn-icon" id="btnImportReportTemplates" title="Importa template da un file di backup"><svg class="ico"><use href="#i-upload"/></svg></button>
                <input type="file" id="inputImportReportTemplates" accept="application/json,.json" style="display:none;">
            </span>
            <!-- (Fase 3) Niente «Chiudi»: c'è già la X in alto. -->
        </div>
    </div>
    <!-- Un solo menù per tutte le righe di entrambi gli elenchi: position:fixed perché dentro
         un elenco che scorre (overflow-y:auto) verrebbe tagliato al primo pixel fuori. -->
    <div id="menuAzioniTemplate" class="tpl-riga-menu"></div>
