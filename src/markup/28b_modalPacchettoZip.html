
    <!-- ESPORTA CANTIERE: il pacchetto ZIP di tutto il progetto (044d). Una barra che avanza, un
         tasto per annullare; a lavoro finito sul telefono compare «Salva o condividi» (il
         pannello di condivisione vuole un tocco nuovo dell'utente), sul PC il file si scarica da solo. -->
    <div class="modal-overlay" id="modalPacchettoOverlay"></div>
    <div class="modal c-x9" id="modalPacchettoZip" role="dialog" aria-modal="true" aria-labelledby="lblPacchettoTitolo">
        <div class="modal-title c-riga-tra-mb2">
            <span class="c-riga4">
                <span class="c-riga-q30-sfondo">
                    <svg class="ico c-accento"><use href="#i-download"/></svg>
                </span>
                <span id="lblPacchettoTitolo" class="c-ellissi">Esporta il progetto</span>
            </span>
            <button type="button" class="chiudi-x" id="btnClosePacchettoX" title="Annulla" aria-label="Annulla"><svg class="ico"><use href="#i-x"/></svg></button>
        </div>
        <div id="lblPacchettoProgetto" class="c-did-muto-mb3"></div>
        <div class="zip-pad">
            <div id="lblPacchettoStato" class="c-testo-mb" aria-live="polite">Preparazione…</div>
            <div id="barraPacchettoBox" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="lblPacchettoStato" class="c-sfondo-bordo3">
                <div id="barraPacchetto" style="background: var(--accent); height: 100%; width: 0%; transition: width var(--mov-medio) var(--ease-entra);"></div>
            </div>
            <div id="lblPacchettoDettaglio" class="zip-did-muto-mt"></div>
        </div>
        <div class="modal-actions zip-riga-mt">
            <button type="button" class="btn-action c-x2" id="btnPacchettoAnnulla">Annulla</button>
            <button type="button" class="btn-action c-x2" id="btnPacchettoSalva" style="display:none"><svg class="ico"><use href="#i-upload"/></svg> Salva o condividi</button>
        </div>
    </div>
