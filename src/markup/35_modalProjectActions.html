
    <!-- MODAL AZIONI PROGETTO (dal bottone "⋯" sulla card in Home) -->
    <div class="modal-overlay" id="modalProjectActionsOverlay"></div>
    <div class="modal c-x5" id="modalProjectActions" role="dialog" aria-modal="true" aria-labelledby="modalProjectActionsTitolo">
        <div class="modal-title c-riga-tra-mb" id="modalProjectActionsTitolo">
            <span class="c-riga4">
                <span class="c-riga-q30-sfondo">
                    <svg class="ico c-accento"><use href="#i-folder"/></svg>
                </span>
                <span id="lblProjectActionsTitle" class="c-ellissi">Azioni Progetto</span>
            </span>
            <button class="btn-icon c-sez-muto-sfondo2" id="btnCloseProjectActionsX" title="Chiudi" aria-label="Chiudi"><svg class="ico"><use href="#i-x"/></svg></button>
        </div>
        <div class="c-did-muto-mb4" id="lblProjectActionsSubtitle"></div>

        <!-- STATO DEL PROGETTO: tre bottoni, al massimo uno acceso; toccare quello acceso toglie lo
             stato. Solo un ordine personale: niente di automatico lo cambia (vedi STATI_PROGETTO). -->
        <div class="c-mb2">
            <div class="azprog-did-muto-mb">Stato</div>
            <div id="projActStato" class="azprog-griglia"></div>
        </div>

        <!-- Lista guidata: azioni sicure raggruppate in righe neutre con icona + titolo + una riga
             di descrizione (invece di pillole tutte dello stesso peso visivo colorate a caso). -->
        <div class="c-colonna3">
            <button class="btn-action azprog-sfondo-bordo-pad" id="btnProjActNote">
                <svg class="ico azprog-muto-mt"><use href="#i-note"/></svg>
                <span class="c-min">
                    <span class="azprog-testo">Note di progetto</span>
                    <span class="azprog-did-muto-mt">Appunti, foto e disegni del progetto</span>
                </span>
            </button>
            <button class="btn-action azprog-sfondo-bordo-pad" id="btnProjActDuplicate">
                <svg class="ico azprog-muto-mt"><use href="#i-copy"/></svg>
                <span class="c-min">
                    <span class="azprog-testo">Duplica progetto</span>
                    <span class="azprog-did-muto-mt">Copia completa, stesso dispositivo</span>
                </span>
            </button>
            <button class="btn-action azprog-sfondo-bordo-pad" id="btnProjActExport">
                <svg class="ico azprog-muto-mt"><use href="#i-print"/></svg>
                <span class="c-min">
                    <span class="azprog-testo">Consegna</span>
                    <span class="azprog-did-muto-mt">Excel, PDF, KML</span>
                </span>
            </button>
            <button class="btn-action azprog-sfondo-bordo-pad" id="btnProjActCronologia">
                <svg class="ico azprog-muto-mt"><use href="#i-reset"/></svg>
                <span class="c-min">
                    <span class="azprog-testo">Copie automatiche</span>
                    <span class="azprog-did-muto-mt">Com'era nelle copie automatiche</span>
                </span>
            </button>
            <button class="btn-action azprog-sfondo-bordo-pad" id="btnProjActConfronta">
                <svg class="ico azprog-muto-mt"><use href="#i-chart"/></svg>
                <span class="c-min">
                    <span class="azprog-testo">Confronta prove</span>
                    <span class="azprog-did-muto-mt">Grafici e colonne stratigrafiche affiancati</span>
                </span>
            </button>
        </div>

        <!-- "Elimina progetto" come link testuale isolato in fondo (redesign richiesto
             esplicitamente: la versione precedente, un tasto pieno rosso identico di peso alle
             altre azioni, era troppo prominente rispetto al rischio reale — il vero paracadute
             contro un tap per errore è già nella modale di conferma dedicata, vedi
             openConfirmDeleteModal/#modalConfirmDelete: nome progetto in chiaro, bottone di
             conferma separato e 10 secondi di undo dopo l'eliminazione. Qui basta un trattamento
             discreto, staccato dalla lista da un divisore, senza riquadro/sfondo/bordo — segnala
             comunque "azione pericolosa" col solo colore, senza gridarlo). -->
        <div class="azprog-mt">
            <button type="button" id="btnProjActDelete" class="azprog-riga-did-pericolo">
                <svg class="ico c-q14"><use href="#i-trash"/></svg> Elimina progetto
            </button>
        </div>
    </div>
