
    <!-- MODAL AZIONI PROGETTO (dal bottone "⋯" sulla card in Home) -->
    <div class="modal-overlay" id="modalProjectActionsOverlay"></div>
    <div class="modal" id="modalProjectActions" style="max-width: 420px;">
        <div class="modal-title" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
            <span style="display: flex; align-items: center; gap: 9px; min-width: 0;">
                <span style="width: 30px; height: 30px; border-radius: 10px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                    <svg class="ico" style="color: var(--accent-ink);"><use href="#i-folder"/></svg>
                </span>
                <span id="lblProjectActionsTitle" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Azioni Progetto</span>
            </span>
            <button class="btn-icon" id="btnCloseProjectActionsX" title="Chiudi" style="background: transparent; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 2px 6px; flex-shrink: 0;"><svg class="ico"><use href="#i-x"/></svg></button>
        </div>
        <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 14px;" id="lblProjectActionsSubtitle"></div>

        <!-- STATO DEL PROGETTO: tre bottoni, al massimo uno acceso; toccare quello acceso toglie lo
             stato. Solo un ordine personale: niente di automatico lo cambia (vedi STATI_PROGETTO). -->
        <div style="margin-bottom: 14px;">
            <div style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .3px; margin-bottom: 6px;">Stato</div>
            <div id="projActStato" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;"></div>
        </div>

        <!-- Lista guidata: azioni sicure raggruppate in righe neutre con icona + titolo + una riga
             di descrizione (invece di pillole tutte dello stesso peso visivo colorate a caso). -->
        <div style="display: flex; flex-direction: column; gap: 6px;">
            <button class="btn-action" id="btnProjActNote" style="justify-content: flex-start; align-items: flex-start; gap: 10px; background: var(--bg-main); border: 1px solid var(--border); color: var(--text-main); padding: 10px 12px; text-align: left;">
                <svg class="ico" style="flex-shrink:0; margin-top:2px; color: var(--text-muted);"><use href="#i-note"/></svg>
                <span style="min-width:0;">
                    <span style="display:block; font-weight:700; font-size:13px;">Note di progetto</span>
                    <span style="display:block; font-size:12px; color:var(--text-muted); font-weight:400; margin-top:1px;">Appunti, foto e disegni del cantiere</span>
                </span>
            </button>
            <button class="btn-action" id="btnProjActDuplicate" style="justify-content: flex-start; align-items: flex-start; gap: 10px; background: var(--bg-main); border: 1px solid var(--border); color: var(--text-main); padding: 10px 12px; text-align: left;">
                <svg class="ico" style="flex-shrink:0; margin-top:2px; color: var(--text-muted);"><use href="#i-copy"/></svg>
                <span style="min-width:0;">
                    <span style="display:block; font-weight:700; font-size:13px;">Duplica progetto</span>
                    <span style="display:block; font-size:11px; color:var(--text-muted); font-weight:400; margin-top:1px;">Copia completa, stesso dispositivo</span>
                </span>
            </button>
            <button class="btn-action" id="btnProjActBackup" style="justify-content: flex-start; align-items: flex-start; gap: 10px; background: var(--bg-main); border: 1px solid var(--border); color: var(--text-main); padding: 10px 12px; text-align: left;">
                <svg class="ico" style="flex-shrink:0; margin-top:2px; color: var(--text-muted);"><use href="#i-download"/></svg>
                <span style="min-width:0;">
                    <span style="display:block; font-weight:700; font-size:13px;">Backup</span>
                    <span style="display:block; font-size:11px; color:var(--text-muted); font-weight:400; margin-top:1px;">Salva una copia offline</span>
                </span>
            </button>
            <!-- Fase 2: il pacchetto di progetto per il PC (o per un altro telefono). Il posto
                 definitivo lo decide la Fase 5; per ora sta qui, nel ⋯ del progetto. -->
            <button class="btn-action" id="btnProjActPorta" style="justify-content: flex-start; align-items: flex-start; gap: 10px; background: var(--bg-main); border: 1px solid var(--border); color: var(--text-main); padding: 10px 12px; text-align: left;">
                <svg class="ico" style="flex-shrink:0; margin-top:2px; color: var(--text-muted);"><use href="#i-upload"/></svg>
                <span style="min-width:0;">
                    <span style="display:block; font-weight:700; font-size:13px;">Porta su un altro dispositivo</span>
                    <span style="display:block; font-size:12px; color:var(--text-muted); font-weight:400; margin-top:1px;">Copia esatta, per il PC o un altro telefono</span>
                </span>
            </button>
            <button class="btn-action" id="btnProjActExport" style="justify-content: flex-start; align-items: flex-start; gap: 10px; background: var(--bg-main); border: 1px solid var(--border); color: var(--text-main); padding: 10px 12px; text-align: left;">
                <svg class="ico" style="flex-shrink:0; margin-top:2px; color: var(--text-muted);"><use href="#i-print"/></svg>
                <span style="min-width:0;">
                    <span style="display:block; font-weight:700; font-size:13px;">Consegna</span>
                    <span style="display:block; font-size:11px; color:var(--text-muted); font-weight:400; margin-top:1px;">Excel, PDF, KML</span>
                </span>
            </button>
            <button class="btn-action" id="btnProjActCronologia" style="justify-content: flex-start; align-items: flex-start; gap: 10px; background: var(--bg-main); border: 1px solid var(--border); color: var(--text-main); padding: 10px 12px; text-align: left;">
                <svg class="ico" style="flex-shrink:0; margin-top:2px; color: var(--text-muted);"><use href="#i-reset"/></svg>
                <span style="min-width:0;">
                    <span style="display:block; font-weight:700; font-size:13px;">Cronologia</span>
                    <span style="display:block; font-size:11px; color:var(--text-muted); font-weight:400; margin-top:1px;">Com'era nelle copie automatiche</span>
                </span>
            </button>
            <button class="btn-action" id="btnProjActConfronta" style="justify-content: flex-start; align-items: flex-start; gap: 10px; background: var(--bg-main); border: 1px solid var(--border); color: var(--text-main); padding: 10px 12px; text-align: left;">
                <svg class="ico" style="flex-shrink:0; margin-top:2px; color: var(--text-muted);"><use href="#i-chart"/></svg>
                <span style="min-width:0;">
                    <span style="display:block; font-weight:700; font-size:13px;">Confronta prove</span>
                    <span style="display:block; font-size:11px; color:var(--text-muted); font-weight:400; margin-top:1px;">Grafici e colonne stratigrafiche affiancati</span>
                </span>
            </button>
        </div>

        <!-- "Elimina progetto" come link testuale isolato in fondo (redesign richiesto
             esplicitamente: la versione precedente, un tasto pieno rosso identico di peso alle
             altre azioni, era troppo prominente rispetto al rischio reale — il vero paracadute
             contro un tap per errore è già nella modale di conferma dedicata, vedi
             openConfirmDeleteModal/#modalConfirmDelete: nome progetto in chiaro, bottone di
             conferma separato e 10 secondi di undo dopo l'eliminazione. Qui basta un trattamento
             discreto, staccato dalla lista da un divisore, senza riquadro/sfondo/bordo — segnala
             comunque "azione pericolosa" col solo colore, senza gridarlo). -->
        <div style="border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; text-align: center;">
            <button type="button" id="btnProjActDelete" style="background: none; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; font-size: 12px; font-weight: 600; color: var(--danger);">
                <svg class="ico" style="width: 14px; height: 14px;"><use href="#i-trash"/></svg> Elimina progetto
            </button>
        </div>
    </div>
