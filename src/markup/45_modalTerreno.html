    <!-- TERRENO E SEZIONI: il DTM del progetto (ritaglio attorno alle prove), la quota di ogni prova,
         e da qui la sezione e la vista 3D. La riempie il pezzo 071f. -->
    <div class="modal-overlay" id="modalTerrenoOverlay"></div>
    <div class="modal terreno" id="modalTerreno" role="dialog" aria-labelledby="titoloTerreno">
        <div class="modal-title" style="display: flex; align-items: center; justify-content: space-between;">
            <span id="titoloTerreno">Terreno e sezioni</span>
            <button type="button" class="chiudi-x" id="btnChiudiTerreno" title="Chiudi" aria-label="Chiudi"><svg class="ico"><use href="#i-x"/></svg></button>
        </div>
        <div id="statoTerreno"></div>
        <div class="terreno-comandi">
            <button type="button" class="bt bt-principale" id="btnApriSezione"><svg class="ico"><use href="#i-layers"/></svg>Sezione tra le prove</button>
            <button type="button" class="bt" id="btnApriVista3d"><svg class="ico"><use href="#i-map"/></svg>Vista 3D</button>
        </div>
        <div class="terreno-comandi">
            <button type="button" class="bt" id="btnCaricaDtm"><svg class="ico"><use href="#i-upload"/></svg><span id="lblCaricaDtm">Carica un DTM</span></button>
            <button type="button" class="bt" id="btnTrovaDtm" title="Le fonti di DTM per le prove: dove trovarli, caricarli o scaricarli"><svg class="ico"><use href="#i-search"/></svg>Trova un DTM</button>
            <button type="button" class="bt" id="btnTogliDtm"><svg class="ico"><use href="#i-trash"/></svg>Togli il DTM</button>
        </div>
        <input type="file" id="fileDtm" accept=".tif,.tiff,.asc,.txt,image/tiff" style="display: none;">
    </div>
