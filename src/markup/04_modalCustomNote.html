
    <!-- MODAL NOTA PERSONALIZZATA -->
    <div class="modal-overlay" id="modalCustomNoteOverlay"></div>
    <div class="modal" id="modalCustomNote" role="dialog" aria-modal="true" aria-labelledby="modalCustomNoteTitolo">
        <div class="modal-title" id="modalCustomNoteTitolo"><svg class="ico"><use href="#i-edit"/></svg> Inserisci Nota Personalizzata</div>
        <div class="form-group c-mb2">
            <label for="txtCustomNoteInput">Testo della Nota</label>
            <input type="text" id="txtCustomNoteInput" class="form-control" placeholder="es. Presenza sabbia umida, cambio colore...">
        </div>
        <div class="modal-actions c-x3">
            <button class="btn-action" id="btnCustomNoteCancel">Chiudi</button>
            <button class="btn-action c-accento-sfondo-bordo" id="btnCustomNoteSave">Applica Nota</button>
        </div>
    </div>
