
    <!-- MODAL NOTA PERSONALIZZATA -->
    <div class="modal-overlay" id="modalCustomNoteOverlay"></div>
    <div class="modal" id="modalCustomNote">
        <div class="modal-title"><svg class="ico"><use href="#i-edit"/></svg> Inserisci Nota Personalizzata</div>
        <div class="form-group" style="margin-bottom: 14px;">
            <label>Testo della Nota</label>
            <input type="text" id="txtCustomNoteInput" class="form-control" placeholder="es. Presenza sabbia umida, cambio colore...">
        </div>
        <div class="modal-actions" style="justify-content: flex-end; gap: 8px;">
            <button class="btn-action" id="btnCustomNoteCancel">Annulla</button>
            <button class="btn-action" id="btnCustomNoteSave" style="background: var(--accent); color: var(--on-accent); border: none;">Applica Nota</button>
        </div>
    </div>
