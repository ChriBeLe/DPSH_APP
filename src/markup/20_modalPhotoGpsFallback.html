
    <!-- MODAL FALLBACK GPS INTELLIGENTE PER FOTO SENZA COORDINATE -->
    <div class="modal-overlay" id="modalPhotoGpsFallbackOverlay"></div>
    <div class="modal fgps-w380-pad" id="modalPhotoGpsFallback" role="dialog" aria-modal="true" aria-labelledby="modalPhotoGpsFallbackTitolo">
        <div class="modal-title c-riga-tra" id="modalPhotoGpsFallbackTitolo">
            <span><svg class="ico"><use href="#i-pin"/></svg> Foto Senza Coordinate GPS</span>
            <button class="btn-action" id="btnClosePhotoGpsFallbackX" style="background:none; border:none; color:var(--text-muted); font-size:16px; padding:${padV} 6px;" aria-label="Chiudi"><svg class="ico"><use href="#i-x"/></svg></button>
        </div>
        <p class="c-did-muto-mb4">
            Questa foto non contiene coordinate GPS nei metadati. Come vuoi assegnarle la posizione?
        </p>
        <div class="c-colonna3" id="photoGpsFallbackChoices">
            <button class="btn-action fgps-did-sfondo-bordo" id="btnPhotoGpsUseLive">
                <svg class="ico"><use href="#i-satellite"/></svg> Usa GPS Attuale del Dispositivo
                <div id="lblPhotoGpsLiveStatus" class="c-did-muto-mt3">Verifica disponibilità...</div>
            </button>
            <button class="btn-action fgps-did-sfondo-bordo" id="btnPhotoGpsUseMap">
                <svg class="ico"><use href="#i-map"/></svg> Scegli un Punto sulla Mappa
            </button>
            <button class="btn-action fgps-did-sfondo-bordo" id="btnPhotoGpsUsePaste">
                <svg class="ico"><use href="#i-edit"/></svg> Incolla Coordinate (es. da Google Maps)
            </button>
            <button class="btn-action fgps-did-muto-sfondo" id="btnPhotoGpsCancel">
                <svg class="ico"><use href="#i-x"/></svg> Nessuna Coordinata (Annulla)
            </button>
        </div>

        <div id="photoGpsPasteBox" class="fgps-mt" style="display:none">
            <div class="c-riga">
                <input type="text" id="txtPhotoGpsPasteCoords" class="form-control c-x2" placeholder="es. 41.845912, 12.562424">
                <button class="btn-action fgps-did-sfondo-bordo2" id="btnPhotoGpsApplyPaste"><svg class="ico"><use href="#i-check"/></svg> Applica</button>
            </div>
            <button class="btn-action fgps-did-muto-sfondo2" id="btnPhotoGpsBackFromPaste"><svg class="ico"><use href="#i-back"/></svg> Indietro</button>
        </div>

        <div id="photoGpsMapBox" class="fgps-mt" style="display:none">
            <div id="photoGpsMapEl" class="fgps-sfondo-bordo"></div>
            <div class="c-did-muto">Tocca la mappa per posizionare il marker sul punto esatto.</div>
            <button class="btn-action fgps-accento-sfondo-bordo" id="btnPhotoGpsConfirmMap"><svg class="ico"><use href="#i-check"/></svg> Conferma Posizione</button>
            <button class="btn-action fgps-did-muto-sfondo3" id="btnPhotoGpsBackFromMap"><svg class="ico"><use href="#i-back"/></svg> Indietro</button>
        </div>
    </div>
