
    <!-- MODAL NUOVO PROGETTO CANTIERE -->
    <div class="modal-overlay" id="modalNewProjectOverlay"></div>
    <div class="modal" id="modalNewProject" role="dialog" aria-modal="true" aria-labelledby="modalNewProjectTitolo">
        <div class="modal-title" id="modalNewProjectTitolo"><svg class="ico"><use href="#i-folder"/></svg> Nuovo progetto</div>
        <p class="c-did-muto-mb5">Crea un nuovo progetto che raccoglierà le tue prove penetrometriche. Il campo <strong class="c-pericolo">Comune</strong> è obbligatorio.</p>

        <div class="form-group c-mb3">
            <label for="txtProjName">Nome del progetto</label>
            <input type="text" id="txtProjName" class="form-control" placeholder="es. Roma - Parco degli Acquedotti">
        </div>

        <div class="c-griglia-mb">
            <div class="form-group">
                <label for="txtProjComune" class="c-pericolo2">Comune *</label>
                <input type="text" id="txtProjComune" class="form-control c-x11" placeholder="es. Roma">
            </div>
            <div class="form-group">
                <label for="txtProjCommittente">Cliente / Committente</label>
                <input type="text" id="txtProjCommittente" class="form-control" placeholder="es. Mario Rossi">
            </div>
        </div>

        <div class="form-group c-mb2">
            <label for="txtProjDate">Data Progetto</label>
            <input type="date" id="txtProjDate" class="form-control">
        </div>

        <div class="modal-actions c-x3">
            <button class="btn-action" id="btnCancelNewProject">Chiudi</button>
            <button class="btn-action c-sfondo-bordo4" id="btnConfirmNewProject"><svg class="ico"><use href="#i-check"/></svg> Crea il progetto e la prova 1</button>
        </div>
    </div>
