
    <!-- MODAL ELIMINAZIONE PROVA (richiede digitazione di CANCELLA) -->
    <div class="modal-overlay" id="modalDeleteSurveyOverlay"></div>
    <div class="modal c-x8" id="modalDeleteSurvey" role="dialog" aria-modal="true" aria-labelledby="modalDeleteSurveyTitolo">
        <div class="modal-title elim-pericolo" id="modalDeleteSurveyTitolo">
            <svg class="ico ico-lg"><use href="#i-alert"/></svg>
            <span>Elimina Prova</span>
        </div>
        <div class="elim-testo-mb">
            Stai per eliminare <strong id="lblDeleteSurveyName" class="c-pericolo">questa prova</strong> dal progetto corrente.
        </div>
        <div id="lblDeleteSurveyDetails" class="elim-did-muto-sfondo"></div>
        <div class="form-group c-mb3">
            <label for="txtDeleteSurveyConfirm" class="c-pericolo">Scrivi CANCELLA per confermare</label>
            <input type="text" id="txtDeleteSurveyConfirm" class="form-control" placeholder="CANCELLA" autocomplete="off" autocapitalize="characters" spellcheck="false">
        </div>
        <div class="c-did-muto-mb4">
            Per 10 secondi puoi ancora annullare; dopo, la prova resta solo nelle copie automatiche.
        </div>
        <div class="modal-actions c-riga5">
            <button class="btn-action c-sfondo-bordo2" id="btnCancelDeleteSurvey">Chiudi</button>
            <button class="btn-action elim-sfondo-bordo" id="btnConfirmDeleteSurvey" disabled aria-disabled="true">
                <svg class="ico"><use href="#i-trash"/></svg> Elimina
            </button>
        </div>
    </div>
