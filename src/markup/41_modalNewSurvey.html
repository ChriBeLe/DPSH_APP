
    <!-- MODAL NUOVA PROVA: COMPILAZIONE INTESTAZIONE CANTIERE -->
    <div class="modal-overlay" id="modalNewSurveyOverlay"></div>
    <div class="modal" id="modalNewSurvey" role="dialog" aria-modal="true" aria-labelledby="modalNewSurveyTitolo">
        <div class="modal-title" id="modalNewSurveyTitolo"><svg class="ico"><use href="#i-list"/></svg> Nuova prova — Scheda della prova</div>
        <p class="c-did-muto-mb5">Compila i dati del progetto prima di iniziare. Il campo <strong class="c-pericolo">Comune</strong> è obbligatorio.</p>

        <div class="c-griglia-mb">
            <div class="form-group">
                <label for="txtNewCommittente">Cliente / Committente</label>
                <input type="text" id="txtNewCommittente" class="form-control" placeholder="es. Mario Rossi">
            </div>
            <div class="form-group">
                <label for="txtNewComune" class="c-pericolo2">Comune *</label>
                <input type="text" id="txtNewComune" class="form-control c-x11" placeholder="es. Genzano">
            </div>
        </div>

        <div class="c-griglia-mb">
            <div class="form-group">
                <label for="txtNewLocalita">Località / Indirizzo</label>
                <input type="text" id="txtNewLocalita" class="form-control" placeholder="es. Via Roma 10">
            </div>
            <div class="form-group">
                <label for="txtNewData">Data Indagine</label>
                <input type="date" id="txtNewData" class="form-control">
            </div>
        </div>

        <div class="nuovaprova-griglia-mb">
            <div class="form-group">
                <label for="txtNewProvaNr">Prova N°</label>
                <input type="text" id="txtNewProvaNr" class="form-control" placeholder="es. 1" value="1">
            </div>
            <div class="form-group">
                <label for="numNewLunghAsta">Lunghezza Asta (m)</label>
                <input type="number" id="numNewLunghAsta" class="form-control" value="1.00" step="0.1">
            </div>
        </div>

        <div class="modal-actions c-x3">
            <button class="btn-action" id="btnNewSurveyCancel">Chiudi</button>
            <button class="btn-action c-sfondo-bordo4" id="btnNewSurveyConfirm"><svg class="ico"><use href="#i-check"/></svg> Conferma e Inizia</button>
        </div>
    </div>

    <!-- BANNER ANNULLA ELIMINAZIONE FLUTTUANTE (TOAST 10s) -->
    <div id="undoNotificationBanner" class="nuovaprova-sfondo-bordo-pad" style="display:none">
        <div class="nuovaprova-riga-testo-ellissi">
            <span><svg class="ico"><use href="#i-trash"/></svg></span> <span id="undoBannerText" class="nuovaprova-ellissi">Progetto eliminato</span>
        </div>
        <button id="btnUndoDeleteProject" style="background: var(--accent); color: var(--on-accent); border: none; font-weight: 800; font-size: 12px; padding: 7px 13px; border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">
            <svg class="ico"><use href="#i-reset"/></svg> Annulla (<span id="undoTimerCountdown">10</span>s)
        </button>
    </div>
