
    <!-- LA SCALETTA DEL REPORT (Fase C, tappa ④ del Progetto). Le sezioni del documento in ordine,
         ognuna col suo template e un interruttore: indice, capitolo introduttivo, una riga per
         prova, tavole 2D e 3D. Non ha dati propri: legge e scrive le stesse proprietà del progetto
         che usa «Esporta PDF», che da qui in poi parte da queste scelte. Righe disegnate in JS. -->
    <div class="modal-overlay" id="modalScalettaOverlay"></div>
    <div class="modal scal-x" id="modalScaletta" role="dialog" aria-modal="true" aria-labelledby="titoloScaletta">
        <div class="modal-title c-tra">
            <span><svg class="ico"><use href="#i-print"/></svg> <span id="titoloScaletta">Scaletta del report</span></span>
            <button type="button" class="btn-icon" id="btnScalettaX" title="Chiudi" aria-label="Chiudi"><svg class="ico"><use href="#i-x"/></svg></button>
        </div>
        <p class="t-didascalia" id="lblScalettaIntro">Le sezioni del documento, nell'ordine in cui escono. Accendi quelle che vuoi e scegli il template di ognuna.</p>
        <div id="listaScaletta" class="c-colonna"></div>
        <div class="modal-actions c-tra-avvolge">
            <button type="button" class="bt-link" id="btnScalettaTemplate">Modifica template</button>
            <span class="c-riga-avvolge">
                <button type="button" class="bt" id="btnScalettaChiudi">Chiudi</button>
                <button type="button" class="bt" id="btnScalettaWord">Word</button>
                <button type="button" class="bt" id="btnScalettaPdfa" title="PDF per l'archiviazione (PDF/A-2b)">PDF/A</button>
                <button type="button" class="bt bt-principale" id="btnScalettaPdf">Esporta PDF</button>
            </span>
        </div>
    </div>
